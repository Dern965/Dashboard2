# .github/workflows/update_data.yml
#
# GitHub Actions — Actualización de datos BMV
# ==========================================
# Este workflow actualiza automáticamente el archivo market_prices.csv
# con datos recientes del mercado mexicano.
#
# Se ejecuta de lunes a viernes en dos momentos:
#   1. A las 7:30 AM, hora Ciudad de México, cerca de la apertura del mercado
#   2. A las 3:00 PM, hora Ciudad de México, después del cierre para intentar guardar
#      los datos finales del día
#
# También se puede lanzar manualmente desde la pestaña "Actions" de GitHub.
#
# Qué hace:
#   1. Clona el repositorio
#   2. Configura Python
#   3. Instala dependencias mínimas
#   4. Ejecuta update_data.py para actualizar datos/market_prices.csv
#   5. Muestra el log de actualización
#   6. Detecta si hubo cambios reales en el CSV
#   7. Si hay cambios, hace commit y push automáticamente
#   8. Guarda el log como artefacto descargable

name: "📈 Actualización de datos BMV"

on:
  # ── Horario automático ────────────────────────────────────────
  # GitHub Actions permite programar workflows con cron.
  # Se usa la zona horaria America/Mexico_City para evitar convertir manualmente a UTC.
  #
  # Ejecuciones:
  #   - 07:30 CDMX, lunes a viernes
  #   - 15:00 CDMX, lunes a viernes
  schedule:
    - cron: "30 7 * * 1-5"     # Apertura / inicio de jornada
      timezone: "America/Mexico_City"

    - cron: "0 15 * * 1-5"     # Después del cierre del mercado
      timezone: "America/Mexico_City"

  # ── Ejecución manual desde la UI de GitHub ────────────────────
  workflow_dispatch:
    inputs:
      force_update:
        description: "Forzar actualización aunque no haya días nuevos"
        required: false
        default: "false"
        type: boolean

# ──────────────────────────────────────────────────────────────────
# Permisos necesarios para que GitHub Actions pueda hacer commit y push
# ──────────────────────────────────────────────────────────────────
permissions:
  contents: write

# ──────────────────────────────────────────────────────────────────
# Evita que se encimen dos ejecuciones del mismo workflow
# ──────────────────────────────────────────────────────────────────
concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update-market-data:
    name: "Descargar y actualizar market_prices.csv"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout del repositorio ───────────────────────────────
      - name: "📥 Clonar repositorio"
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ── 2. Configurar Python ──────────────────────────────────────
      - name: "🐍 Configurar Python 3.11"
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Instalar dependencias mínimas del script ───────────────
      - name: "📦 Instalar dependencias"
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pytz

      # ── 4. Ejecutar el script de actualización ────────────────────
      - name: "🔄 Actualizar datos de mercado"
        id: update
        run: |
          python update_data.py \
            --csv datos/market_prices.csv \
            --log datos/update.log
        continue-on-error: true

      # ── 5. Mostrar resumen del log en la interfaz de GitHub ───────
      - name: "📋 Mostrar log de actualización"
        if: always()
        run: |
          echo "====== LOG DE ACTUALIZACIÓN ======"
          cat datos/update.log || echo "(log vacío o no generado)"

      # ── 6. Verificar si hubo cambios en el CSV ────────────────────
      - name: "🔍 Detectar cambios"
        id: changes
        run: |
          git diff --name-only datos/market_prices.csv

          if git diff --quiet datos/market_prices.csv; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No hay datos nuevos. El CSV ya estaba al día."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT

            ROWS=$(python -c "import pandas as pd; df=pd.read_csv('datos/market_prices.csv'); print(len(df))")
            echo "rows=$ROWS" >> $GITHUB_OUTPUT

            echo "Se detectaron cambios en el CSV ($ROWS filas totales)."
          fi

      # ── 7. Commit y push solo si hubo cambios ─────────────────────
      - name: "💾 Commit y push de datos actualizados"
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FECHA=$(TZ="America/Mexico_City" date "+%Y-%m-%d %H:%M CDMX")

          git add datos/market_prices.csv datos/update.log
          git commit -m "📈 Datos BMV actualizados — $FECHA (${{ steps.changes.outputs.rows }} filas)"
          git push

      # ── 8. Mensaje si no hubo cambios ─────────────────────────────
      - name: "ℹ️ Sin cambios"
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "El CSV ya estaba al día. No se hizo commit."

      # ── 9. Guardar log como artefacto descargable ─────────────────
      - name: "📁 Guardar log como artefacto"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "log-actualizacion-${{ github.run_id }}"
          path: datos/update.log
          retention-days: 14
          if-no-files-found: warn
